<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kraken Control</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <div id="titlebar">
      <div class="wordmark">KRAKEN<span>CONTROL</span></div>
      <div class="profile"><b>Active Profile:</b> <select id="profile-select"></select></div>
      <div class="status"><span class="dot" id="conn-dot"></span><span id="conn-text">connecting</span></div>
    </div>
    <div id="sidebar">
      <div class="nav" id="nav"></div>
      <div class="bottom" id="nav-bottom"></div>
    </div>
    <div id="content"></div>
  </div>
  <div id="modal-root"></div>
  <script src="app.js"></script>
</body>
</html>
