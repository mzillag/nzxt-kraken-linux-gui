[package]
name = "kraken_q565"
version = "0.1.0"
edition = "2021"
description = "C ABI wrapper around the q565 encoder for the NZXT Kraken Elite LCD fast path"
license = "MIT"

[lib]
name = "kraken_q565"
crate-type = ["cdylib"]

[dependencies]
q565 = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
